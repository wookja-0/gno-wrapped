# Production stack: the images built by .github/workflows/release.yml, behind Caddy (HTTPS from
# Let's Encrypt). Run from the repo root on the server (deploy/deploy.sh does):
#   IMAGE_TAG=<sha> docker compose --env-file .env -f deploy/compose.prod.yml up -d
name: gno-wrapped

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

x-indexer: &indexer
  INDEXER_URL: ${INDEXER_URL:-https://indexer.gno.land/graphql/query}
  INDEXER_WS_URL: ${INDEXER_WS_URL:-}
  CHUNK_BLOCKS: ${CHUNK_BLOCKS:-10000}
  REQUEST_DELAY: ${REQUEST_DELAY:-3s}
  DATA_DIR: /data

services:
  ingest:
    image: ${IMAGE_REPO:-ghcr.io/wookja-0/gno-wrapped}-batch:${IMAGE_TAG:-latest}
    command: ["live"]
    environment: *indexer
    volumes:
      - ../data:/data
    restart: unless-stopped
    logging: *logging

  # one-off: docker compose --env-file .env -f deploy/compose.prod.yml run --rm batch verify
  batch:
    image: ${IMAGE_REPO:-ghcr.io/wookja-0/gno-wrapped}-batch:${IMAGE_TAG:-latest}
    profiles: ["batch"]
    environment: *indexer
    volumes:
      - ../data:/data
    logging: *logging

  api:
    image: ${IMAGE_REPO:-ghcr.io/wookja-0/gno-wrapped}-api:${IMAGE_TAG:-latest}
    environment:
      DATA_DIR: /data/out
    volumes:
      - ../data/out:/data/out:ro
    restart: unless-stopped
    logging: *logging

  web:
    image: ${IMAGE_REPO:-ghcr.io/wookja-0/gno-wrapped}-web:${IMAGE_TAG:-latest}
    environment:
      WRAPPED_API_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them, Let's Encrypt rate-limits re-issuing
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
