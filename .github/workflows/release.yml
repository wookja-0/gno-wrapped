name: Release

# main (a push or a merged pull request): test, build amd64 images tagged with the commit, deploy them.
# A merged pull request whose last commit passed CI isn't tested again; a direct push to main is.
# Images before the move to the shared CronBark host (x86_64) are arm64 only: no rollback to those.
# Run by hand with a commit SHA to redeploy images that already exist (a rollback).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose images to deploy (empty = build and deploy the latest main)
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Was this commit merged from a pull request whose last commit passed CI? Then it's been tested.
  # Pull request CI runs on the pull request merged into main, so unless main moved before the merge,
  # that's the code this commit holds.
  tested:
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0] | \"\(.number) \(.head.sha)\"" || true)
          pr=${found%% *} head=${found#* }
          if [ -z "$found" ] || [ "$pr" = null ]; then echo "Not merged from a pull request: run CI"; exit 0; fi
          ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0].conclusion')
          echo "Pull request #$pr, CI on ${head:0:7}: ${ci:-none}"
          if [ "$ci" = success ]; then echo "pr=$pr" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: tested
    if: ${{ !inputs.sha && !needs.tested.outputs.pr }}
    uses: ./.github/workflows/ci.yml

  images:
    needs: [tested, ci]
    # after CI, or without it when the pull request's CI passed
    if: ${{ !cancelled() && !inputs.sha && needs.tested.result == 'success' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.tested.outputs.pr)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [batch, api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # web: share links and og:image use the public origin, baked in at build time
          build-args: NEXT_PUBLIC_SHARE_BASE_URL=${{ vars.SHARE_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: ${{ !cancelled() && (needs.images.result == 'success' || (inputs.sha && needs.images.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the AWS deploy role; no AWS keys stored here
    env:
      SHA: ${{ inputs.sha || github.sha }}
      INSTANCE: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy over SSM
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "gno-wrapped $SHA" --timeout-seconds 900 \
            --parameters "commands=[\"set -e\",\"cd /opt/gno-wrapped\",\"git fetch -q origin\",\"git checkout -q --detach $SHA\",\"deploy/deploy.sh $SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $status"
          test "$status" = Success
      - name: Check the site
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.SHARE_BASE_URL }}/"
          curl -fsS -o /dev/null --retry 5 --retry-delay 6 --retry-all-errors "${{ vars.SHARE_BASE_URL }}/personas"
