name: CI

# Pull requests. On main, release.yml runs this before it builds and deploys, unless the commit is a
# merged pull request that already passed it.
on:
  pull_request:
  workflow_call:

# A new push to a pull request cancels its older run; release.yml's call (no PR number) never shares
# a group, so it's never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [batch, api]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: batch/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5 # the e2e tests start the api with `go run`
        with:
          go-version-file: api/go.mod
          cache-dependency-path: batch/go.sum
      - run: npm ci
      # next build's cache (the e2e step builds the app): same lockfile, then the closest previous build
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/package-lock.json') }}-
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Playwright drives the runner's Google Chrome (channel: 'chrome'). Without batch output the
      # tests that need real data skip themselves. E2E_PROD: against a production build, four at a
      # time (playwright.config.ts), which is several times faster than the dev server here.
      - run: npm run e2e
        env:
          E2E_PROD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
